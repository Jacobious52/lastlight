[package]
name = "lastlight"
version = "0.1.0"
edition = "2024"
description = "An exploration horror game about choosing to be seen"
publish = false

[dependencies]
bevy = { version = "0.18.1", default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_log", "bevy_audio", "bevy_color", "bevy_core_pipeline", "bevy_gizmos", "bevy_image", "bevy_mesh", "bevy_camera", "bevy_render", "bevy_shader", "bevy_sprite", "bevy_sprite_render", "bevy_text", "bevy_ui", "bevy_ui_render", "bevy_window", "bevy_winit", "default_font", "multi_threaded", "png", "wav", "vorbis", "webgl2", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
web-sys = { version = "0.3", features = ["Window", "Storage", "Location", "Document", "HtmlElement"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[features]
# Isolated late-game starts for development; never enabled in release scripts.
playtest = []
